name: 24/7 Multi-Session Client Acquisition & Growth Engine

on:
  schedule:
    # 4 Sessions per day (IST is UTC+5:30):
    # 04:00 UTC = 09:30 AM IST (Morning: Playbook to @extrovertnerd.dev)
    # 08:00 UTC = 01:30 PM IST (Midday: Client Offer to @extrovertnerd)
    # 12:00 UTC = 05:30 PM IST (Evening: Playbook to @extrovertnerd.dev)
    # 16:00 UTC = 09:30 PM IST (Night: Client Offer to @extrovertnerd + Full Dual-Channel Report)
    - cron: '0 4,8,12,16 * * *'

  workflow_dispatch:
    inputs:
      session:
        description: 'Select Session to run'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - midday
          - evening
          - night
          - report

permissions:
  contents: write

jobs:
  run_daily_cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Dual-Channel Session & Meta Graph Publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_DEV_ID: ${{ secrets.IG_DEV_ID }}
          IG_DEV_TOKEN: ${{ secrets.IG_DEV_TOKEN }}
          IG_AGENCY_ID: ${{ secrets.IG_AGENCY_ID }}
          IG_AGENCY_TOKEN: ${{ secrets.IG_AGENCY_TOKEN }}
          TARGET_SESSION: ${{ inputs.session || github.event.inputs.session || 'auto' }}
        run: |
          SESSION="${TARGET_SESSION:-auto}"
          echo "Target Session: $SESSION"
          if [ "$SESSION" = "report" ]; then
            python3 daily_manager.py --report
          else
            python3 daily_manager.py --session "$SESSION"
          fi

      - name: Commit & Push Progress Advancement
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/progress.json || true
          git commit -m "chore: auto-advance session state [skip ci]" || echo "No changes to commit"
          git push
