name: Daily Web Playbook Poster Dispatcher

on:
  schedule:
    # Runs everyday at 10:00 AM IST (04:30 AM UTC)
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual 1-click execution anytime

permissions:
  contents: write

jobs:
  dispatch_poster:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Today's Poster & Dispatch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: |
          python make_poster.py --today --send-telegram --upload-ig

      - name: Commit & Push Progress Advancement
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/progress.json
          git commit -m "chore: auto-advance playbook to next day [skip ci]" || echo "No progress changes to commit"
          git push

      - name: Archive Today's Poster & Caption
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-poster-output
          path: output/
          retention-days: 14
