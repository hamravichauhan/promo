name: 24/7 Multi-Session Client Acquisition & Growth Engine

on:
  schedule:
    # 09:30 AM IST (04:00 UTC) - Morning Web Playbook + Micro Growth
    - cron: '0 4 * * *'
    # 01:30 PM IST (08:00 UTC) - Midday Client Offer + Story Blitz
    - cron: '0 8 * * *'
    # 05:30 PM IST (12:00 UTC) - Evening Web Playbook + Micro Growth
    - cron: '0 12 * * *'
    # 09:30 PM IST (16:00 UTC) - Night Client Offer + Full Day Executive Report to Telegram
    - cron: '0 16 * * *'

  workflow_dispatch:
    inputs:
      session:
        description: 'Select Session to run'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - midday
          - evening
          - night
          - report

permissions:
  contents: write

jobs:
  run_daily_cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Session & Autonomous Growth
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          TARGET_SESSION: ${{ github.event.inputs.session || 'auto' }}
        run: |
          echo "Target Session: $TARGET_SESSION"
          if [ "$TARGET_SESSION" = "report" ]; then
            python daily_manager.py --report
          else
            python daily_manager.py --session "$TARGET_SESSION"
          fi

      - name: Commit & Push Progress Advancement
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/progress.json data/growth_state.json || true
          git commit -m "chore: auto-advance session state & growth logs [skip ci]" || echo "No changes to commit"
          git push

      - name: Archive Session Outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-poster-output
          path: output/
          retention-days: 14
